<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ thống Giám sát Realtime</title>
    
    <!-- CSS: Định dạng giao diện ngay tại đây -->
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #eef2f7;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .monitor-card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            width: 350px;
        }
        h1 { color: #1a73e8; font-size: 1.5rem; margin-bottom: 25px; }
        #message-box {
            font-size: 1.8rem;
            font-weight: bold;
            color: #333;
            margin: 20px 0;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
        }
        #timestamp { color: #666; font-size: 0.9rem; }
        .status-indicator {
            margin-top: 20px;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }
        .dot { height: 10px; width: 10px; background-color: #4caf50; border-radius: 50%; display: inline-block; }
    </style>
</head>
<body>

    <div class="monitor-card">
        <h1>Bảng Điều Khiển</h1>
        <div id="message-box">Đang kết nối...</div>
        <div id="timestamp">Đang chờ dữ liệu từ máy tính...</div>
        
        <div class="status-indicator">
            <span class="dot"></span>
            <span id="auth-text">Đang xác thực bảo mật...</span>
        </div>
    </div>

    <!-- Tích hợp các thư viện Firebase SDK v8 -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <script>
        // Cấu hình Firebase với API Key bạn cung cấp
        const firebaseConfig = {
            apiKey: "lCCKFjYy7sxgzizmsHYqZRuPeC2eoIqHCPTTu9C8", // Mã Auth của bạn
            authDomain: "camera-detect-b0be0.firebaseapp.com",
            databaseURL: "https://camera-detect-b0be0-default-rtdb.firebaseio.com",
            projectId: "camera-detect-b0be0",
            storageBucket: "camera-detect-b0be0.appspot.com",
        };

        // Khởi tạo Firebase
        firebase.initializeApp(firebaseConfig);

        // Lệnh quan trọng: Đăng nhập ẩn danh để có UID vượt qua Rules auth != null[cite: 3]
        firebase.auth().signInAnonymously()
            .then(() => {
                document.getElementById('auth-text').innerText = "Đã xác thực thành công";
                console.log("Xác thực ẩn danh thành công!");

                // Sau khi login xong mới bắt đầu lắng nghe Database
                const db = firebase.database();
                const msgRef = db.ref('message');

                msgRef.on('value', (snapshot) => {
                    const data = snapshot.val();
                    if (data) {
                        document.getElementById('message-box').innerText = data.text;
                        document.getElementById('timestamp').innerText = "Cập nhật lúc: " + data.timestamp;
                    }
                });
            })
            .catch((error) => {
                console.error("Lỗi bảo mật:", error.message);
                document.getElementById('message-box').innerText = "Truy cập bị chặn!";
                document.getElementById('auth-text').innerText = "Lỗi: Kiểm tra lại Firebase Auth";
                document.getElementById('auth-text').style.color = "red";
            });
    </script>
</body>
</html>
